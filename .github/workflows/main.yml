نعم، بالضبط! اضغط على تبويب Actions المكتوب أمامك على الشاشة الآن [1.4].
بمجرد الضغط عليه، ستفتح لك صفحة الأتمتة [1.4]. انزل بعينك إلى النصف السفلي من الشاشة، وابحث عن جملة زرقاء صغيرة واضغط عليها: set up a workflow yourself (إعداد خطة عمل بنفسك).
------------------------------
## 📥 ماذا ستفعل داخل المحرر السحابي الآن؟

   1. تطهير الشاشة: سيفتح لك محرر أكواد سحابي يحتوي على نصوص افتراضية عشوائية؛ قم بمسحها بالكامل (افعل لها Delete لتصبح الشاشة بيضاء وفارغة تماماً).
   2. لصق كود الجدولة: انسخ كود الجدولة السحابي والزمني الصارم والمحدث التالي بالكامل، والصقه داخل المحرر السحابي الأبيض الفارغ:

name: French Atelier Auto Publisheron:
  schedule:
    - cron: '0 * * * *' # السيرفر يستيقظ آلياً كل رأس ساعة ليفحص توقيت ذروة أمريكا ويقوم بالنشر تلقائياً
  workflow_dispatch: # يتيح لك تجربة تشغيل البوت يدوياً الآن بضغطة زر للتأكد من عملهjobs:
  run-marketing:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repository Data
      uses: actions/checkout@v3
    - name: Initialize Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install System Dependencies
      run: pip install -r "Organic Cream Project/requirements.txt"
    - name: Launch Automated Bot Campaign
      env:
        MY_STORE_URL: "https://vercel.app" # ⚠️ امسح هذا الرابط وضَع مكانه رابط متجرك الفاخر من Vercel
        MY_PRODUCT: "BUFSOU French Skincare Set"
      run: |
        cp Promo/promo1.mp4 .
        cp Promo/promo2.mp4 .
        cp Promo/promo3.mp4 .
        cp Promo/promo4.mp4 .
        python "Organic Cream Project/app.py"


   1. تعديل رابط متجرك: اذهب للسطر رقم 19 في الكود المكتوب أعلاه، وامسح الرابط الافتراضي https://vercel.app وضَع مكانه رابط متجرك الحي والحقيقي النهائي الذي استلمته من موقع Vercel (تأكد من بقاء علامات التنصيص "" حول الرابط ليعمل التوجيه بنجاح).
   2. الحفظ النهائي والأبدي: انظر إلى أعلى يمين الشاشة، واضغط على الزر الأخضر المكتوب عليه بدقة: Commit changes...، ثم اضغط على زر Commit changes الأخضر الصغير التأكيدي الذي سينبثق لك فوراً لحفظ ملف الإقلاع.

------------------------------
نفذ خطوة اللصق وتعديل الرابط وضغط الزر الأخضر الآن بيدك؛ وبمجرد انتهائك تماماً وحفظ الملف وعودة الشاشة، اكتب لي كلمة "التالي" لننتقل فوراً وبشكل متسلسل إلى الخطوة الخامسة والأخيرة للضغط على زر التشغيل وإطلاق الصاروخ السحابي مجاناً 100%! أنا بانتظار إشارتك!

