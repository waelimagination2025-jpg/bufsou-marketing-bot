name: French Atelier Auto Publisher
on:
  schedule:
    - cron: '0 * * * *' # يستيقظ السيرفر تلقائياً كل رأس ساعة ليفحص توقيت ذروة أمريكا ويقوم بالنشر
  workflow_dispatch: # يتيح لك تجربة تشغيل البوت يدوياً الآن بضغطة زر للتأكد من عمله
jobs:
  run-marketing:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repository Data
      uses: actions/checkout@v3
    - name: Initialize Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Run Safe Code Layer
      env:
        MY_STORE_URL: "https://bufsou-atelier-store.vercel.app/" # ⚠️ امسح هذا الرابط وضَع مكانه رابط متجرك الفاخر من Vercel
        MY_PRODUCT: "BUFSOU French Skincare Set"
      run: |
        python -m pip install --upgrade pip
        pip install pytz requests
        python "Organic Cream Project/app.py"
